name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # Matrix guards the README's "Python 3.10+" claim: every leg from the
    # floor (3.10) through the current stable release (3.14) must stay
    # green (#82, #100). Keep the README's Development section in sync —
    # tests/test_readme_install.py fails if the two drift apart.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Install from requirements.txt (not `pip install -e .`) so this works
      # regardless of whether packaging (#71) lands. pan-scm-sdk is pinned so
      # the 7 SDK contract tests always execute instead of silently skipping.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest "pan-scm-sdk==0.14.0"

      # pytest.importorskip("scm") skips only when the import fails; proving
      # the import here makes silent contract-test skips impossible in CI.
      - name: Verify pan-scm-sdk is importable
        run: python -c "import scm"

      - name: Run tests
        run: python -m pytest tests/ -rs
